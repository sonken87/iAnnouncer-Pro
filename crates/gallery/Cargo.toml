[package]
name = "gallery"
description = "Interactive showcase of the skeuo-ui components"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks", "launch"] }
skeuo-ui = { path = "../skeuo-ui" }

[dev-dependencies]
dioxus-ssr = "0.7.10"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
