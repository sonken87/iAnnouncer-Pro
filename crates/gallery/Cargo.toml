[package]
name = "gallery"
description = "Interactive showcase of the skeuo-ui components"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks", "launch"] }
skeuo-ui = { path = "../skeuo-ui" }
# See crates/skeuo-ui/Cargo.toml: dioxus-web needs web-sys's `Location`; the
# native build of the web feature (snapshots) needs it too.
web-sys = { version = "0.3", features = ["Location"], optional = true }

[dev-dependencies]
dioxus-ssr = "0.7.10"

[features]
default = ["web"]
web = ["dioxus/web", "dep:web-sys"]
desktop = ["dioxus/desktop"]
