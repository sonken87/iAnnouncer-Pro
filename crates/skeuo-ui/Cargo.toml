[package]
name = "skeuo-ui"
description = "Skeuomorphic UI components for Dioxus, with an MUI-style API"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `mounted`: overlays focus themselves via onmounted (off by default on web
# when dioxus default features are disabled). `document`: MapView loads its
# script with document::eval.
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks", "mounted", "document"] }

# dioxus-web 0.7.10's `document` feature uses web-sys's `Location` without
# enabling it; with dioxus' default features something else does. Ask for it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Location"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
