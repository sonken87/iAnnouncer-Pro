[package]
name = "skeuo-ui"
description = "Skeuomorphic UI components for Dioxus, with an MUI-style API"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `mounted`: overlays focus themselves via onmounted (off by default on web
# when dioxus default features are disabled).
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks", "mounted"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
